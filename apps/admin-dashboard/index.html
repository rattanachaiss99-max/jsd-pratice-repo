<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Go Thailand</title>

  <!-- Shared Design System Styles -->
  <link rel="stylesheet" href="../../shared/styles/variables.css">
  <link rel="stylesheet" href="../../shared/styles/reset.css">
  <link rel="stylesheet" href="../../shared/styles/components.css">

  <!-- Local Page Style -->
  <link rel="stylesheet" href="css/dashboard-style.css">
</head>
<body>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span>⚙️</span> Dashboard
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="sidebar-link active">📊 ภาพรวม</a>
        <a href="#" class="sidebar-link">👥 ผู้ใช้งาน</a>
        <a href="#" class="sidebar-link">⚙️ ตั้งค่า</a>
        <a href="../main-website/index.html" class="sidebar-link back-link">⬅️ กลับหน้าหลัก</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <header class="dashboard-header">
        <h1>แผงควบคุมระบบหลังบ้าน</h1>
        <span class="badge">Admin Mode</span>
      </header>

      <div class="stats-grid">
        <div class="card stat-card">
          <span class="stat-number">5</span>
          <span class="stat-label">สมาชิกในทีม</span>
        </div>
        <div class="card stat-card">
          <span class="stat-number">3</span>
          <span class="stat-label">Apps ใน Monorepo</span>
        </div>
        <div class="card stat-card">
          <span class="stat-number">100%</span>
          <span class="stat-label">Shared Design System</span>
        </div>
      </div>
    </main>
  </div>

  <script src="../../shared/js/main.js"></script>
</body>
</html>
